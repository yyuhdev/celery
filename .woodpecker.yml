clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      recursive: true

steps:
  setup-buf:
    image: gradle:jdk-25-and-25
    commands:
      - |
        set -e
        BUF_VERSION=1.66.1
        curl -sSL "https://github.com/bufbuild/buf/releases/download/v$${BUF_VERSION}/buf-Linux-x86_64" -o /usr/local/bin/buf
        chmod +x /usr/local/bin/buf
        /usr/local/bin/buf --version

  integration-test:
    image: gradle:jdk-25-and-25
    commands:
      - ./gradlew testing:test --no-daemon
    environment:
      DOCKER_HOST: tcp://docker:2375
      TESTCONTAINERS_RYUK_DISABLED: "true"

  build:
    image: gradle:jdk-25-and-25
    commands:
      - ./gradlew build -x test --no-daemon

services:
  docker:
    image: docker:dind
    privileged: true
    command: ["--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
      # If privileged mode is blocked by Woodpecker trust level, swap to:
      # image: docker:dind-rootless
      # privileged: false

when:
  branch: v3
  event: [push, pull_request, manual]
