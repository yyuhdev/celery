# =============================================================================
# Celery Development Infrastructure
# =============================================================================
# Start all services:    docker compose up -d
# Start specific:        docker compose --profile storage up -d
# Stop all:              docker compose down
# Reset (nuke volumes):  docker compose down -v
# =============================================================================

services:
  # ── MongoDB: Primary Storage ──────────────────────────────────────────────
  mongodb:
    image: mongo:8.0
    container_name: celery-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-admin}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [storage, all]

  # ── Redis: Pub/Sub Messaging ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: celery-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispass}
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [pubsub, all]

  # ── Redis Cache ──────────────────────────────────────────────────────────
  redis-cache:
    image: redis:7-alpine
    container_name: celery-redis-cache
    restart: unless-stopped
    ports:
      - "${REDIS_CACHE_PORT:-6380}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_CACHE_PASSWORD:-rediscachepass}
      --save 60 1
      --loglevel warning
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "${REDIS_CACHE_PASSWORD:-rediscachepass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [cache, all]

  # ── NATS: High-Performance Messaging ─────────────────────────────────────
  nats:
    image: nats:2-alpine
    container_name: celery-nats
    restart: unless-stopped
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITORING_PORT:-8222}:8222"
    command: >
      -js
      -m 8222
      --auth ${NATS_PASSWORD:-natspass}
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:8222/healthz", "-O", "/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [pubsub, all]

  # ── InfluxDB: Time-Series Logging ────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: celery-influxdb
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-influxpass}
      DOCKER_INFLUXDB_INIT_ORG: celery
      DOCKER_INFLUXDB_INIT_BUCKET: logging
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_PASSWORD:-influxpass}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: [storage, all]

volumes:
  mongodb_data:
    name: celery_mongodb_data
  redis_data:
    name: celery_redis_data
  redis_cache_data:
    name: celery_redis_cache_data
  nats_data:
    name: celery_nats_data
  influxdb_data:
    name: celery_influxdb_data
  influxdb_config:
    name: celery_influxdb_config
