services:
  redis1:
    image: redis:7-alpine
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --loglevel warning
    ports:
      - "6379"

  redis2:
    image: redis:7-alpine
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --loglevel warning
    ports:
      - "6379"

  redis3:
    image: redis:7-alpine
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --loglevel warning
    ports:
      - "6379"

  redis4:
    image: redis:7-alpine
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --loglevel warning
    ports:
      - "6379"

  redis5:
    image: redis:7-alpine
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --loglevel warning
    ports:
      - "6379"

  redis6:
    image: redis:7-alpine
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file /data/nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --protected-mode no
      --loglevel warning
    ports:
      - "6379"

  cluster-init:
    image: redis:7-alpine
    depends_on:
      - redis1
      - redis2
      - redis3
      - redis4
      - redis5
      - redis6
    entrypoint: [ ]
    command: >
      sh -c "
      echo 'Waiting for all nodes...' &&
      sleep 15 &&
      echo yes | redis-cli --cluster create
      redis1:6379 redis2:6379 redis3:6379
      redis4:6379 redis5:6379 redis6:6379
      --cluster-replicas 1 &&
      echo 'Cluster created'
      "
